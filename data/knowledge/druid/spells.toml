note = "Niveles: lista «Abilities by level» de Warcraft Tavern (Forever). Los ids salen de memoria (Classic), salvo los marcados de Forever, que da Warcraft Tavern: todos sin comprobar en el cliente. Instructores: Mardant Strongoak (Cañada Umbría), Kal (Dolanaar), Mathrengyl Bearwalker, Denatharion y Fylerian Nightwing (Darnassus, Enclave Cenarion) y Loganaar (Claro de la Luna)."

