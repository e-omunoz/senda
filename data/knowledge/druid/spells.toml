# [[train]]: lo que enseña el instructor de druida en Forever, para un elfo de la noche (docs/TRAINER.md).
#   Los que llevan sources = ["trainer:..."] los genera tools/gen_trainer.py --rewrite (no editar a mano: cambia
#   data/knowledge/trainer/policy.json y regenera). Uno por nivel con todo lo que la build necesita (hechizos nuevos
#   y subidas de rango) y uno aparte por cada hechizo opcional (optional = true: no cuenta como pendiente).
#   names   nombres del cliente esES, en el orden de spells; cost = suma en cobre.
#   Los demás [[train]] son a mano: lo de inicio, las formas y habilidades de misión (quest) y lo que falta en la lista.
#   La lista capturada del instructor no trae los niveles 8 a 14: esos salen del nivel del cliente (SpellLevels).
# [[check]]: hechizos clave del análisis del personaje (aviso si no se conocen 2 niveles después).
id = "druid-spells"
class = "DRUID"
kind = "spells"
title = "Hechizos del instructor de druida"
levels = [1, 60]
order = 80
status = "unverified"
sources = ["polestar:19bd636e/addon/Polestar/QoL/ClassSpells.lua", "ingame-client:1.60.1.70888", "https://www.warcrafttavern.com/forever/guides/druid-leveling/", "questie:quest/5931", "questie:quest/5061", "questie:quest/98393", "questie:npc/4217", "questie:npc/12042"]
checked = "2026-11-12"
note = "Niveles, ids y costes: listas del instructor de Forever (TrinityCore forever, vía Polestar); nombres del cliente esES. Instructores: Mardant Strongoak (Cañada Umbría), Kal (Dolanaar), Mathrengyl Bearwalker, Denatharion y Fylerian Nightwing (Darnassus, Enclave Cenarion) y Loganaar (Claro de la Luna)."

