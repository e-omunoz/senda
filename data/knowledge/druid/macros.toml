# Druida: macros. Escrito para Senda (no migrado).
# Mismo formato y marcadores que data/knowledge/warlock/macros.toml ({id}, {n:Nombre}); `fallbacks` en orden:
# se usa la primera cuyos hechizos conozcas.
# Reglas para el cliente moderno (Midnight): solo /cast con condiciones estándar ([stealth], [swimming], [outdoors],
# [form], [mod], [@...]), /cancelform y «!» (no quita la forma si ya estás en ella). Nada de /castsequence ni de
# lógica que dependa de vida, energía o auras: esas condiciones no existen en macros y en Midnight esos valores son
# secretos en combate. Nombres de 16 caracteres como mucho.
id = "druid-macros"
class = "DRUID"
kind = "macros"
title = "Macros del druida"
order = 90
status = "unverified"
sources = ["https://www.warcrafttavern.com/forever/guides/druid/", "https://www.warcrafttavern.com/forever/news/powershifting-is-back-sort-of-hunter-druid-deep-dive-for-wow-forever/"]
checked = "2026-11-11"
note = "Macros escritas por el autor; ninguna guía de Forever publica macros de druida. Sin probar en el juego. No se usan números de [form:N] porque el orden de las formas depende de las que conozcas."

[[macro]]
name = "SND_Cura"
icon = "spell:8936"
minlevel = 1
body = """
#showtooltip
/cancelform [form]
/cast [mod:alt,@player] {774}; [@mouseover,help,nodead][@player] {8936}"""
fallbacks = ["""
#showtooltip
/cancelform [form]
/cast [mod:alt,@player] {774}; [@player] {5185}""", """
#showtooltip
/cast [@player] {5185}"""]
note = "Sale de la forma y te cura: Recrecimiento (al ratón si es amistoso, si no a ti); con Alt, Rejuvenecimiento. Antes del 12, Toque de sanación."

[[macro]]
name = "SND_Raices"
icon = "spell:339"
minlevel = 8
body = """
#showtooltip {339}
/cast [@focus,harm,nodead][@mouseover,harm,nodead][] {339}"""
note = "Raíces enredadoras al foco, al ratón o al objetivo. En Forever valen en interiores."

[[macro]]
name = "SND_Oso"
icon = "spell:5487"
minlevel = 10
body = """
#showtooltip
/cast !{9634}"""
fallbacks = ["""
#showtooltip
/cast !{5487}"""]
note = "Entra en Oso temible (40) u Oso sin quitártelo si ya estás en él."

[[macro]]
name = "SND_Gru"
icon = "spell:6795"
minlevel = 10
body = """
#showtooltip {6795}
/cast [@mouseover,harm,nodead][] {6795}"""
note = "Gruñido al enemigo bajo el ratón (para quitárselo a un compañero) o a tu objetivo."

[[macro]]
name = "SND_Viaje"
icon = "spell:783"
minlevel = 16
body = """
#showtooltip
/cast [swimming] !{1066}; [outdoors] !{783}; !{768}"""
fallbacks = ["""
#showtooltip
/cast [swimming] !{1066}; !{768}""", """
#showtooltip
/cast !{1066}"""]
note = "En el agua, Forma acuática; al aire libre, Forma de viaje (30); dentro, Forma felina (con Celeridad feral corre un 30% más). Antes del 20 solo la acuática."

[[macro]]
name = "SND_Feerico"
icon = "spell:770"
minlevel = 18
body = """
#showtooltip {770}
/cast [@mouseover,harm,nodead][] {770}"""
note = "Fuego feérico al ratón o al objetivo. En Forever es de base y se usa en forma; si en forma el hechizo tiene otro id, cámbialo aquí."

[[macro]]
name = "SND_Gato"
icon = "spell:768"
minlevel = 20
body = """
#showtooltip {768}
/cancelform [form]
/cast {768}"""
fallbacks = ["""
#showtooltip {768}
/cast !{768}"""]
note = "Vuelve a entrar en Forma felina: quita raíces y ralentizaciones. En Forever Furor ya no da energía al cambiar (la conserva) y el «cambio de forma con poder» lo sustituye Poder cambiante: esto es para escapar, no para ganar energía."

[[macro]]
name = "SND_Abrir"
icon = "spell:6785"
minlevel = 20
body = """
#showtooltip
/cast [noform] !{768}; [nostealth,nocombat] {5215}; [stealth] {6785}; {1082}"""
fallbacks = ["""
#showtooltip
/cast [noform] !{768}; [nostealth,nocombat] {5215}; [stealth] {5221}; {1082}"""]
note = "Una tecla para todo el felino: sin forma, Forma felina; fuera de combate, Acechar; en sigilo, Devastar (32) o Triturar; en combate, Arañazo."

[[macro]]
name = "SND_Carga"
icon = "spell:16979"
minlevel = 20
body = """
#showtooltip
/cast [@mouseover,harm,nodead][] {1238122}"""
fallbacks = ["""
#showtooltip
/cast [@mouseover,harm,nodead][] {16979}"""]
note = "Cargar feral (talento del 20): en oso inmoviliza e interrumpe, en felino salta detrás. 1238122 es el id de Forever según Warcraft Tavern; 16979, el de Classic."

[[macro]]
name = "SND_Poder"
icon = "spell:1322605"
minlevel = 40
body = """
#showtooltip
/cast {1322605}"""
note = "Poder cambiante (talento del 40): maná por 40 de energía sin salir del felino. Id de Warcraft Tavern, sin comprobar."

[[macro]]
name = "SND_Estimular"
icon = "spell:29166"
minlevel = 40
body = """
#showtooltip {29166}
/cast [@mouseover,help,nodead][@player] {29166}"""
note = "Estimular al aliado bajo el ratón o a ti. En solitario, úsalo con poco maná para curarte y volver a felino."
