id = "druid-gear"
class = "DRUID"
kind = "page"
title = "Equipo: prioridad de estadísticas (feral)"
order = 140
status = "unverified"
sources = ["https://www.warcrafttavern.com/forever/guides/druid-leveling/", "https://www.warcrafttavern.com/forever/guides/feral-druid/", "https://www.warcrafttavern.com/forever/guides/druid/", "https://www.method.gg/wow-forever/wow-forever-druid-leveling-guide-and-talents"]
checked = "2026-11-11"
note = "Prioridad feral de Warcraft Tavern (Fuerza/Agilidad/poder de ataque > Aguante/Intelecto/Espíritu > armadura). En Forever los ataques en forma escalan con el daño del arma (Warcraft Tavern y Method): de ahí el peso alto de DPS. Lista de objetos: Method (7-nov) y Warcraft Tavern; ids y niveles requeridos de QuestieDB (Forever)."


[[block]]
heading = "Prioridad"
body = """
**DPS del arma > Fuerza ≈ Agilidad > poder de ataque > Aguante > Intelecto = Espíritu > armadura.**

- En Forever las formas escalan con el daño de tu arma (también con piedras de afilar): un arma de dos manos con buen DPS es la mayor mejora.
- Intelecto y Espíritu ayudan a curarte entre combates y a usar Poder cambiante, pero no matan.
- Antes del 10 (sin formas): Intelecto y Aguante."""

[[block]]
heading = "Armas"
body = """
- Empiezas con **dagas y bastones**.
- **Armas de puño:** Ilyenia Moonfire (Darnassus).
- **Mazas de una y dos manos:** Buliwyf Stonehand (Forjaz).
- **Armas de asta** (nuevas para el druida en Forever) desde el 20: Woo Ping (Ventormenta).
- Ranura de reliquia: **ídolos** (el Ídolo de las mareas cambiantes sale de la misión de la Forma acuática)."""

[[block]]
heading = "Al 60"
body = """
- **Felino (bandas):** golpe hasta 9%, pericia, crítico, celeridad, Agilidad, Fuerza, poder de ataque.
- **Oso:** defensa (440 para jefes de banda), esquiva, armadura, Aguante."""

[[block]]
heading = "Dónde buscar equipo"
body = """
Los objetos de abajo, más la lista general de data/knowledge/general/gear-items.toml (los de todas las clases). Si no hay nada: recompensas de misión y verdes «del mono» o «del oso» en la casa de subastas."""

