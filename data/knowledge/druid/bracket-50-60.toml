sources = ["https://www.warcrafttavern.com/forever/guides/druid-leveling/", "https://www.warcrafttavern.com/forever/guides/feral-druid/", "https://www.method.gg/wow-forever/wow-forever-druid-leveling-guide-and-talents", "https://warcraft.wiki.gg/wiki/Patch_1.60", "questie:quest/6761", "questie:quest/6762"]
