[[block]]
heading = "Consejos de barras"
body = """
- Coloca cada barra **estando en esa forma**: el juego guarda una barra distinta para normal, felino y oso.
- Deja las mismas teclas para lo mismo en las tres: 1 = abrir/golpe principal, 4 = Fuego feérico, 8 = Cargar feral, 12 = cambiar de forma.
- SND_Cura sale de la forma y te cura: tenla también en la barra de felino y oso si quieres (cuesta un cambio de forma volver).
- En Classic las barras no suben de rango solas: vuelve a colocar los hechizos después de entrenar."""
