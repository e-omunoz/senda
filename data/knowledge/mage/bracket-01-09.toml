body = """
- Agua conjurada siempre: nunca compres bebida.
- Intelecto Arcano a todo el que pase: hace amigos.
- Junto a Sam Sarsaparilla (Elwynn) hay una hoguera de campamento: siéntate para el descanso mejorado.
- La varita no escala con el poder con hechizos y tienes que estar quieto medio segundo antes de que dispare."""
