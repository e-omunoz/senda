# [[train]]: lo que enseña el instructor de mago en Forever, para un humano (docs/TRAINER.md).
#   Los que llevan sources = ["trainer:..."] los genera tools/gen_trainer.py --rewrite (no editar a mano: cambia
#   data/knowledge/trainer/policy.json y regenera). Uno por nivel con todo lo que la build necesita (hechizos nuevos
#   y subidas de rango) y uno aparte por cada hechizo opcional (optional = true: no cuenta como pendiente).
#   names   nombres del cliente esES, en el orden de spells; cost = suma en cobre.
#   Los demás [[train]] son a mano: teletransportes y portales (instructora de portales), libros y lo de inicio.
# [[check]]: hechizos clave del análisis del personaje (aviso si no se conocen 2 niveles después).
