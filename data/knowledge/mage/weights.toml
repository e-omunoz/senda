# Pesos de equipo por build y tramo de nivel (los lee Modules/Gear.lua). Formato: docs/GEAR.md.
#
# De dónde sale cada número:
#  · 1-39: pesos de subida de Polestar (addon/Polestar/Gear/Weights.lua, GPL-3.0, commit 19bd636e, tramo `frost`
#    «Polestar leveling» de SpecData.lua): sp 1.1, spFrost 1.1, int 0.9, spi 0.6, sta 0.6, mp5 1.8, rdps 1.5,
#    armor 0.005, spellHit 9, spellCrit 6. Aquí divididos entre 1.1 para que el poder con hechizos valga 1.
#  · 40-59: media 50 % Polestar + 50 % wowsims Classic (la mezcla es criterio, el mismo método de Polestar).
#    wowsims/classic commit 7779ebbf79dc7f1341e6ab939b28a3402c9a730a (24-jul-2026), ui/mage/sim.ts, epWeights
#    (MIT): Intellect 0.49, SpellPower 1, FrostPower 1, SpellHit 18.59, SpellCrit 13.91, MP5 0.11 (Espíritu y
#    Aguante: 0, no los simula).
#  · 60: 25 % Polestar + 75 % wowsims Classic.
id = "mage-weights"
class = "MAGE"
kind = "weights"
title = "Pesos de equipo: Escarcha"
