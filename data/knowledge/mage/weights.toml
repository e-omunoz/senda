status = "unverified"
sources = ["polestar:19bd636e/addon/Polestar/Gear/Weights.lua", "polestar:19bd636e/addon/Polestar/Gear/SpecData.lua", "https://github.com/wowsims/classic/blob/7779ebbf79dc7f1341e6ab939b28a3402c9a730a/ui/mage/sim.ts"]
checked = "2026-11-12"
note = "Pesos de subida de Polestar (fórmulas de Classic) hasta el 39; desde el 40 mezclados con la simulación de wowsims Classic (nivel 60)."

