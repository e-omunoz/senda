[[phase]]
from = 1
to = 9
spells = [116, 2136, 5019]
text = """
1. Descarga de Escarcha antes de que llegue.
2. Otra mientras se acerca.
3. Explosión de Fuego para rematar.
4. Varita si te quedas sin maná."""

[[phase]]
from = 10
to = 19
spells = [116, 2136, 122, 5019]
text = """
1. Descarga de Escarcha x2.
2. Explosión de Fuego cuando llegue.
3. Nova de Escarcha y aléjate.
4. Descarga de Escarcha.
5. Varita para rematar."""

[[phase]]
from = 20
to = 39
spells = [116, 122, 2136, 1953]
text = """
1. Descarga de Escarcha.
2. Nova de Escarcha y aléjate.
3. Lanza de hielo en cuanto esté congelado (o con Dedos de Escarcha).
4. Descarga de Escarcha.
5. Explosión de Fuego o Lanza de hielo (comparten 8 s).
6. Traslación para separarte."""
note = "Lanza de hielo es un talento de Forever (22) sin id conocido."

[[phase]]
from = 40
to = 60
spells = [116, 120, 133, 2948, 2136]
text = """
**Escarcha:** Descarga de Escarcha de relleno. Lanza de hielo con congelación o con Dedos de Escarcha. Cono de frío con 5 cargas de Escalofrío del invierno.

**Fuego (bandas):** Piroexplosión de apertura, Chamuscar hasta 5 cargas, Bola de Fuego de relleno, Explosión de Fuego cuando esté lista, Piroexplosión con 3 de Calentamiento."""

