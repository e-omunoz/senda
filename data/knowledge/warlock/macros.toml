# Migrado de BrujoGnomoGuia 4.1.0 (Macros.lua, ns.MACROS). Nombres renombrados de BG_* a SND_*.
# Marcadores en los cuerpos (los sustituye el módulo de macros):
#   {id}      nombre del hechizo con ese id en el idioma del cliente (p. ej. {980}).
#   {hs}      id de la Piedra de salud que llevas ahora (se actualiza al cambiar las bolsas).
#   {n:Nombre} nombre literal del hechizo (cuando no hay id fiable).
# `body` es la versión preferida; `fallbacks` son alternativas: se usa la primera cuyos hechizos conozcas.
# `pet = true`: hechizo de demonio, no se comprueba en tu libro de hechizos.
# `icon`: "spell:<id>" o "item:<id>" (de Bars.lua) para la barra de acción.
id = "warlock-macros"
class = "WARLOCK"
kind = "macros"
title = "Macros del brujo"
order = 90
status = "unverified"
sources = ["legacy:BrujoGnomoGuia 4.1.0"]
note = "Cuerpos copiados tal cual de la fuente."

[[macro]]
name = "SND_Abrir"
legacy = "BG_Abrir"
icon = "spell:980"
minlevel = 1
body = """
#showtooltip {980}
/petattack
/cast {980}"""
fallbacks = ["""
#showtooltip {348}
/petattack
/cast {348}"""]
note = "Envía al demonio y lanza tu hechizo de apertura (Terror de agonía desde el 8; antes, Inmolar)."

