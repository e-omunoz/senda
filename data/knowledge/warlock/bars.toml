[[block]]
heading = "Consejos de barras"
body = """
- **Teclas 1-6:** lo que pulsas en cada combate, en orden. **7 a =:** reacciones (Miedo, piedra, escudo, Espiral).
- **Mayúsculas + 1-6:** macros de ratón encima para un segundo enemigo. **Inferior derecha:** invocar y crear, fuera de combate.
- Barra 1: Abrir, Corrupción, Inmolar, Drenar, Varita, Transfusión de vida.
- Barra 2: Miedo, Piedra, Sacrificio, maldiciones.
- Usa /focus en el segundo enemigo y las macros con foco (Miedo, Desterrar, Interrumpir, Espiral).
- En Classic las barras no suben de rango solas: vuelve a colocarlas después de entrenar.
- Colocar las barras sustituye la barra principal (1 a =) y las seis primeras casillas de las barras inferiores, y asigna Mayúsculas + 1 a 6. Si no ves las barras inferiores, actívalas en Opciones > Interfaz > Barras de acción."""
