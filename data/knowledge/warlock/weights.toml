w = { SP = 1.0, SCHOOL_W = 0.925, INT = 0.36, SPI = 0.15, STA = 0.21, MP5 = 0.355, WAND_DPS = 0.5, ARMOR = 0.001, SPELL_HIT = 11.84, SPELL_CRIT = 6.69 }
