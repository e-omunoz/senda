# Migrado de BrujoGnomoGuia 4.1.0 (Crafting.lua, ns.CRAFT.PROFS.tailor y MageData.lua CRAFT_TRAINERS).
# [[route]]: prof, from, to, craft (id del objeto fabricado), name (nombre esES según Wowhead), n (fabricaciones
#   aproximadas para todo el tramo), mats = [[id, cantidad]] por fabricación, src (origen de la receta si no la
#   enseña el instructor), note. Si la receta del juego pide otra cosa, manda la receta.
#   Las madejas se pueden contar como paño suelto: ver [[material]].made_from en professions-materials.toml.
# [[trainer]]: instructores. for_class = clase para la que se usaba (gnomo brujo → Forjaz; humano mago → Ventormenta).
#   at = [uiMapID, x, y, "etiqueta"] cuando la fuente daba coordenadas.
