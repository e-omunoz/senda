# Migrado de BrujoGnomoGuia 4.1.0 (Gear.lua, ns.GEAR.WHERE): equipo de subida para lanzadores de la Alianza.
# [[item]]: from/to = niveles en los que interesa (el addon lo mostraba desde from - 3); id = objeto;
#   name = nombre de Wowhead en español (el cliente da el definitivo); src = de dónde sale;
#   class = solo para esa clase (si falta, sirve a brujo y mago).
# Nombres en inglés = la fuente no daba el nombre español (lo resuelve el cliente por id).
id = "general-gear-items"
class = "ANY"
kind = "page"
title = "Equipo de subida para lanzadores"
levels = [1, 60]
order = 150
status = "unverified"
sources = ["legacy:BrujoGnomoGuia 4.1.0", "https://www.wowhead.com/forever", "https://timesaver.gg/", "https://www.warcrafttavern.com/forever/", "https://www.method.gg/", "https://warcraft.wiki.gg/wiki/Patch_1.60"]
checked = "2026-11-09"
note = "Niveles = nivel requerido según Wowhead Forever. Fuentes: datos de objetos de Wowhead Forever, timesaver.gg (listas de Aflicción y Escarcha), Warcraft Tavern, Method, Warcraft Wiki."

[[block]]
heading = "Cómo usar la lista"
body = """
- Bastón o arma de una mano + mano izquierda: quédate con lo que sume más.
- Las piezas de Sastrería solo las puede llevar quien las fabrica.
- La misión The Orb of Soran'ruk te deja elegir el bastón **o** el orbe.
- Varita Furia de Hielo: la misión Mage's Wand te deja elegir una de tres varitas."""

