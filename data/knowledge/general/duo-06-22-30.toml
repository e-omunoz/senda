[[block]]
heading = "Dónde"
body = """
- **Los Humedales:** mazmorra nueva Excavation Site (24-29), con cadenas desde Menethil, Crestagrana y Vallefresno.
- **Bosque del Ocaso** (Villa Oscura): misiones de no-muertos y huargen. Ojo: la Polimorfia no funciona en no-muertos; ahí el Abisario aguanta y el mago usa la Nova.
- **Montañas Crestagrana:** la Torre de Ilgalar (misión de clase del mago, Tratado de Ur) y las misiones de orcos.
- **Mazmorra:** Cavernas de Brazanegra (Vallefresno): Cetro de lápida (varita) para los dos."""

[[block]]
heading = "Táctica"
body = """
Desde el 22 el mago tiene Lanza de hielo: Nova, os alejáis los dos y Lanza. El brujo se queda con el Abisario delante y drena."""
