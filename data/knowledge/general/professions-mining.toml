# Minería 1-300 (GENERADO por tools/gen_gathering.py: no editar; se regenera con `python tools/gen_gathering.py`).
# [[route]]: un tramo por banda de 25 de habilidad (prof, from, to, craft = id del objeto que da, name, n = recogidas
#   esperadas, note = mejores zonas). [[zone]]: nodos por zona, nodes = [[objeto, habilidad mínima, nodos a la vez]],
#   at = punto central del grupo más denso. [[bracket]]: mejores zonas por banda, zones = [[mapa, x, y, subidas por barrido]].
# [[trainer]]: instructores por bando con coordenadas.
id = "general-professions-mining"
class = "ANY"
kind = "professions"
title = "Minería 1-300"
order = 216
status = "unverified"
sources = ["foreverdb:object,spawn,npc,ui_map", "wago:Lock@1.60.1.70888", "polestar:19bd636e/gathering", "polestar:19bd636e/node-abundance"]
checked = "2026-11-13"
note = "Zonas, bandas y rutas con las reglas de Classic y los nodos que mantiene cada zona a la vez (reservas de aparición de Forever, vía Polestar). Cobre 1; Estaño e Incendicita 65; Plata y Petrosangre 75; Hierro 125; Oro 155; Mitril 175; Veraplata y Hierro Negro 230; Torio pequeño 245; Torio rico 275; todas esas habilidades existen en la tabla Lock del cliente de Forever. Poor Copper Vein (zonas de inicio de Forever) cuenta como habilidad 1. En Teldrassil Forever usa Chunk of Amber (sin datos de cantidad aquí: Senda no los cuenta). Rangos sin nivel de personaje, como Herboristería. Hace falta un Pico de minero en las bolsas."

