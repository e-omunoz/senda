# Pesca 1-300 (GENERADO por tools/gen_gathering.py: no editar; se regenera con `python tools/gen_gathering.py`).
# [[route]]: un tramo por banda de 25 de habilidad (prof, from, to, craft = id del objeto que da, name, n = recogidas
#   esperadas, note = mejores zonas). [[zone]]: nodos por zona, nodes = [[objeto, habilidad mínima, nodos a la vez]],
#   at = punto central del grupo más denso. [[bracket]]: mejores zonas por banda, zones = [[mapa, x, y, subidas por barrido]].
# [[trainer]]: instructores por bando con coordenadas.
id = "general-professions-fishing"
class = "ANY"
kind = "professions"
title = "Pesca 1-300"
order = 218
status = "unverified"
sources = ["foreverdb:npc,spawn,ui_map", "polestar:19bd636e/fishing"]
checked = "2026-11-13"
note = "Pesca (sin verificar en Forever; reglas de Classic como las usa Polestar). Cada captura sube la habilidad por debajo de 75; después, una de cada (habilidad-50)/25: unas 1.300 capturas hasta 300. Una captura cuenta igual en cualquier agua: lo que cambia es que el agua dura pierde peces hasta la habilidad `full` de cada zona (base de la zona de Classic + 95). Oficial se aprende con el instructor a 50 y nivel 10; Experto es un libro (Old Man Heming, Bahía del Botín; habilidad 125); Artesano es la misión de Nat Pagle (Marjal Revolcafango; habilidad 200). Se necesita una caña de pescar."

