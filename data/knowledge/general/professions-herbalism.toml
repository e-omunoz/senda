# Herboristería 1-300 (GENERADO por tools/gen_gathering.py: no editar; se regenera con `python tools/gen_gathering.py`).
# [[route]]: un tramo por banda de 25 de habilidad (prof, from, to, craft = id del objeto que da, name, n = recogidas
#   esperadas, note = mejores zonas). [[zone]]: nodos por zona, nodes = [[objeto, habilidad mínima, nodos a la vez]],
#   at = punto central del grupo más denso. [[bracket]]: mejores zonas por banda, zones = [[mapa, x, y, subidas por barrido]].
# [[trainer]]: instructores por bando con coordenadas.
id = "general-professions-herbalism"
class = "ANY"
kind = "professions"
title = "Herboristería 1-300"
order = 215
status = "unverified"
sources = ["foreverdb:object,spawn,npc,ui_map", "wago:Lock@1.60.1.70888", "polestar:19bd636e/gathering", "polestar:19bd636e/node-abundance"]
checked = "2026-11-13"
note = "Zonas, bandas y rutas calculadas con las reglas de Classic (naranja < req+25, amarillo < req+50, verde < req+100, gris después) y los nodos que mantiene cada zona a la vez (reservas de aparición de la base de datos de Forever, vía Polestar). Las habilidades mínimas de las hierbas son las de Classic y todas existen en la tabla Lock del cliente de Forever; Marefoil, Demonsage y Loto de la muerte (hierbas nuevas de Forever) no tienen datos y no entran. Wilted Peacebloom y Stunted Silverleaf (zonas de inicio de Forever) se tratan como habilidad 1. Los rangos de Forever no piden nivel de personaje a partir de Aprendiz (listas de instructor capturadas): Oficial se aprende a 50, Experto a 125 y Artesano a 200."

