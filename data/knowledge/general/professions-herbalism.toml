# Herboristería 1-300 (recolección). Mismo formato que professions-tailoring.toml.
# [[route]]: prof, from, to, craft (id de la hierba principal del tramo: aquí no se fabrica, se recoge), name,
#   n (hierbas aproximadas que recoger en todo el tramo), herbs (todas las hierbas que suben en ese tramo; extra),
#   note (zonas). Sin mats: la recolección no gasta material.
# [[trainer]]: instructores. for_class = clase para la que se pone (druida elfo de la noche → Teldrassil/Darnassus).
id = "general-professions-herbalism"
class = "ANY"
kind = "professions"
title = "Herboristería 1-300"
order = 215
status = "unverified"
sources = ["https://www.warcrafttavern.com/forever/guides/herbalism/", "https://www.method.gg/wow-forever/herbalism-in-wow-forever-leveling-guide-herbalism-items-enchants-trainers", "https://rankedboost.com/world-of-warcraft/forever/professions/herbalism-leveling/", "questie:npc/3604", "questie:npc/4204"]
checked = "2026-11-11"
note = "Tramos de hierbas y zonas de Warcraft Tavern (guía de Herboristería de Forever); la asignación de tramos a habilidad la hizo el autor. Las hierbas suben habilidad unos 100 puntos y se vuelven verdes a unos 50. Ids de hierbas comprobados en QuestieDB (Forever); habilidad mínima de cada hierba: la de Classic, sin confirmar en Forever. Cambios de Forever: materiales escasos (Frilled Lichen, Rosecap, Stranglevine), semillas de hierbas en cuatro calidades, hierbas nuevas (Marefoil, Demonsage, Death Lotus), Té de espina de oro (+15) y Buscar hierbas compatible con otros rastreos (no con Buscar minerales)."

