body = """
Tierras Altas de Arathi, Desolace, Vega de Tuercespina y Riverglades (35-45, base de la Alianza en Farholde Keep). Mazmorras: Monasterio Escarlata (sus 4 alas), Uldaman y The Drowned City (35-40)."""

[[block]]
heading = "Misiones de clase"
body = """
- **Brujo:** cadena del Manáfago (30) y del Corcel nefasto (40, incluye la equitación).
- **Mago:** Viaje al pantano (30-40, Pantano de Fangos Oscuros) para la varita de mago. Al 33, reinicia talentos."""

[[block]]
heading = "Oro"
body = """
El mago tiene que pagar la equitación del 40 (unos 100 de oro); el brujo no. Si os repartís el oro, que el brujo ayude al mago a llegar."""
