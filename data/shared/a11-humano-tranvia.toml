# Entrada humana a la ruta compartida de la Alianza (10/11 -> 12).
# El humano acaba el Bosque de Elwynn hacia el 10-11 junto a Ventormenta y coge el Tranvía subterráneo
# para unirse a la ruta en Loch Modan (a12-loch-modan), igual que el gnomo.
# Coordenadas: QuestieDB de Forever (tools/lookup.py). Ventormenta usa en QuestieDB las coordenadas del mapa
# moderno (Dungar Longdrink 71.3, 72.2); ver data/shared/ROUTE-a.md.
id = "a11-humano-tranvia"
title = "Ventormenta: Tranvía a Forjaz (humanos)"
levels = [10, 12]
map = 1453
summary = "Solo humanos: ruta de vuelo de Ventormenta, Tranvía subterráneo a Forjaz y ruta de vuelo de Forjaz. Después, Loch Modan."
if = { race = ["Human"] }

