# Registro de fuentes del harness de IA de Senda.
#
# tier:
#   official             -> Blizzard (noticias, mensajes azules, notas de desarrollo, hotfixes).
#                           Cuenta para `verified` por sí sola (regla a de ARCHITECTURE.md).
#   community_curated    -> wikis y guías editadas (warcraft.wiki.gg, Wowhead, Icy Veins...).
#                           Solo cuenta para `verified` junto a QuestieDB local (regla c).
#   community_unverified -> Reddit, hilos de foro de jugadores, exportaciones de Discord.
#                           Nunca cuenta para `verified`; sirve para detectar pistas.
#
# kind:
#   rss | atom      -> feed estándar
#   html            -> página de listado; se siguen los enlaces que casan con `link_pattern`
#   discourse       -> categoría o tema de foro Discourse (foros de Blizzard); `blue_only`
#                      se queda solo con mensajes de empleados de Blizzard (tier official)
#   local_dir       -> carpeta local (exportaciones de Discord, notas pegadas a mano)
#   reference       -> no se vigila; solo sirve para clasificar URL citadas por la IA
#
# match: prefijos de URL (sin esquema) que se clasifican con el tier de esta fuente.
#        Gana el prefijo más largo. Una URL que no casa con nada es community_unverified.
# cadence: "hourly" | "daily" | "weekly" (o un número de horas).
# lang: idioma principal de la fuente.
#
# Las URL marcadas con `check = true` son una suposición razonable que hay que confirmar
# la primera vez que se ejecute `watch` (el informe avisa si fallan).

[defaults]
cadence = "daily"
max_items = 10           # elementos nuevos por fuente y ejecución
max_item_chars = 40000   # por encima se avisa en el informe y se recorta
user_agent = "SendaHarness/0.1 (+https://github.com/e-omunoz/senda)"

# --------------------------------------------------------------------------- oficiales

[[source]]
id = "blizzard-forever"
name = "World of Warcraft Forever (portal oficial)"
tier = "official"
kind = "html"
# Página renderizada con JS: se vigila entera (cambio de hash) en lugar de seguir enlaces.
url = "https://worldofwarcraft.blizzard.com/forever"
match = ["worldofwarcraft.blizzard.com/forever", "worldofwarcraft.blizzard.com"]
cadence = "daily"
lang = "en"

[[source]]
id = "blizzard-news"
name = "Noticias y hotfixes de World of Warcraft (Blizzard)"
tier = "official"
kind = "html"
url = "https://worldofwarcraft.blizzard.com/en-us/news"
# Enlaces del tipo /news/24315281/wow-forever-hotfixes-november-10-2026
link_pattern = '/news/\d+'
# Filtro por slug/título: noticias de Forever y todos los hotfixes (el modelo descarta los de Retail).
keywords = ["forever", "hotfix"]
match = ["worldofwarcraft.blizzard.com/en-us/news", "worldofwarcraft.blizzard.com/es-es/news",
         "worldofwarcraft.blizzard.com/es-mx/news", "worldofwarcraft.blizzard.com/news", "news.blizzard.com"]
cadence = "daily"
lang = "en"

[[source]]
id = "forums-us-forever-blue"
name = "Foros EE. UU. de Forever (solo mensajes azules)"
tier = "official"
kind = "discourse"
url = "https://us.forums.blizzard.com/en/wow/c/wow-forever/347"
blue_only = true
# Los hilos de jugadores en el foro NO son oficiales: el prefijo general es community_unverified
# (ver forums-us-forever-players). Solo los mensajes azules que el watcher ha leído llevan tier official.
match = []
cadence = "daily"
lang = "en"

[[source]]
id = "forums-eu-forever-blue"
name = "Foros UE de Forever (solo mensajes azules)"
tier = "official"
kind = "discourse"
url = "https://eu.forums.blizzard.com/en/wow/c/wow-forever/359"
blue_only = true
match = []
cadence = "daily"
lang = "en"

[[source]]
id = "dev-notes"
name = "Notas de desarrollo de Forever"
