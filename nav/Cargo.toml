# Senda's offline navigation pipeline (docs/NAV.md). Build-time only: nothing here runs in the game.
# crates/forge-gamedata, crates/forge-navbuild and crates/forge-core (jsnum only) are copied from
# Polestar (https://github.com/fitzforge/polestar, commit 19bd636e, GPL-3.0-only, LICENSE-POLESTAR);
# crates/senda-nav is Senda's own (GPL-3.0).
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.87"
repository = "https://github.com/fitzforge/polestar"
homepage = "https://github.com/fitzforge/polestar"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"

[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
tabs_in_doc_comments = "allow"
neg_cmp_op_on_partial_ord = "allow"
needless_range_loop = "allow"
nonminimal_bool = "allow"
manual_range_contains = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
