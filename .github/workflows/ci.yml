name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests de las herramientas
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar datos
        run: |
          python tools/validate.py
          python tools/validate.py --json > validate-report.json

      - name: Generar Lua
        run: python tools/build.py

      - name: Lo generado está commiteado
        run: |
          git diff --exit-code -- addon/Senda/Guides addon/Senda/Knowledge addon/Senda/Senda.toc || {
            echo "::error::Lo generado no coincide con lo commiteado. Ejecuta 'python tools/build.py' y commitea."
            exit 1
          }
          untracked="$(git ls-files --others --exclude-standard -- addon/Senda/Guides addon/Senda/Knowledge)"
          if [ -n "$untracked" ]; then
            echo "::error::Archivos generados sin commitear:"
            echo "$untracked"
            exit 1
          fi

      # Sin apt: los espejos de Ubuntu de los runners fallan a veces. Estas actions compilan Lua
      # desde lua.org y LuaRocks desde su repositorio.
      - name: Instalar Lua 5.1
        uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.1.5"

      - name: Instalar LuaRocks
        uses: leafo/gh-actions-luarocks@v5

      - name: Instalar luacheck
        run: luarocks install luacheck

      - name: Sintaxis (luac -p)
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          find addon/Senda -name '*.lua' -print0 | xargs -0 -r "$LUAC" -p
          echo "luac -p: OK"

      - name: luacheck
        run: luacheck addon/Senda

      - name: Empaquetar
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: senda-package
          path: |
            dist/*.zip
            validate-report.json
          if-no-files-found: error

  wowsim:
    name: Simulación headless (fengari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/wowsim/package-lock.json

      - name: Instalar dependencias
        working-directory: tests/wowsim
        run: npm ci

      - name: Escenarios del addon sobre la API simulada
        working-directory: tests/wowsim
        run: node run.js
