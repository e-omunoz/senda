name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests de las herramientas
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar datos
        run: |
          python tools/validate.py
          python tools/validate.py --json > validate-report.json

      - name: Generar Lua
        run: python tools/build.py

      - name: Lo generado está commiteado
        run: |
          git diff --exit-code -- addon/Senda/Guides addon/Senda/Knowledge addon/Senda/Senda.toc || {
            echo "::error::Lo generado no coincide con lo commiteado. Ejecuta 'python tools/build.py' y commitea."
            exit 1
          }
          untracked="$(git ls-files --others --exclude-standard -- addon/Senda/Guides addon/Senda/Knowledge)"
          if [ -n "$untracked" ]; then
            echo "::error::Archivos generados sin commitear:"
            echo "$untracked"
            exit 1
          fi

      # luacheck es una comprobación extra. Si los espejos de apt del runner fallan (pasa a veces),
      # se avisa y se sigue: la sintaxis y la ejecución real del addon las cubre el job de simulación.
      - name: Instalar Lua 5.1 y luacheck
        id: lua
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 &&             sudo apt-get install -y -o Acquire::Retries=3 lua5.1 luarocks && break
            echo "apt falló (intento $i); reintento en 20 s"; sleep 20
          done
          sudo luarocks install luacheck

      - name: Sintaxis (luac -p)
        if: steps.lua.outcome == 'success'
        run: |
          LUAC="$(command -v luac5.1 || command -v luac)"
          find addon/Senda -name '*.lua' -print0 | xargs -0 -r "$LUAC" -p
          echo "luac -p: OK"

      - name: luacheck
        if: steps.lua.outcome == 'success'
        run: luacheck addon/Senda

      - name: Aviso si no se pudo instalar luacheck
        if: steps.lua.outcome != 'success'
        run: echo "::warning::No se pudo instalar Lua/luacheck (espejos de apt). Se omite luacheck; la simulación sigue validando el addon."

      - name: Empaquetar
        run: python tools/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: senda-package
          path: |
            dist/*.zip
            validate-report.json
          if-no-files-found: error

  wowsim:
    name: Simulación headless (fengari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/wowsim/package-lock.json

      - name: Instalar dependencias
        working-directory: tests/wowsim
        run: npm ci

      - name: Escenarios del addon sobre la API simulada
        working-directory: tests/wowsim
        run: node run.js
