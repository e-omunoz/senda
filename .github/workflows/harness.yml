name: Harness IA

# Mantiene la información de Senda al día con Claude. Nunca empuja a main ni fusiona:
# abre (o actualiza) un PR con la etiqueta "harness" que un humano revisa y aprueba.
# Requisitos (ver docs/HARNESS.md):
#   - Secreto ANTHROPIC_API_KEY.
#   - Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
#   - Opcional: secreto HARNESS_PR_TOKEN (PAT fine-grained) para que el PR dispare la CI normal.

on:
  schedule:
    - cron: "17 6 * * *"    # diario: watch + propose
    - cron: "43 7 * * 1"    # lunes: audit + tips + propose
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea"
        type: choice
        options: [daily, weekly, watch, audit, tips, propose]
        default: daily
      guide:
        description: "Guía (vacío = todas)"
        type: string
        default: ""
      limit:
        description: "Límite de elementos / secciones / razas-clases (vacío = sin límite)"
        type: string
        default: ""
      budget_usd:
        description: "Tope de gasto estimado (USD)"
        type: string
        default: "5"
      model:
        description: "Modelo (vacío = claude-opus-5-5)"
        type: string
        default: ""
      dry_run:
        description: "Solo imprimir prompts (no llama a la API ni abre PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness
  cancel-in-progress: false

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.HARNESS_PR_TOKEN || github.token }}
      SENDA_HARNESS_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.HARNESS_PR_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: harness/requirements.txt

      - name: Dependencias
        run: pip install -r harness/requirements.txt

      # Datos abiertos de misiones (forever-db, GPL-3) para tools/verify.py y tools/lookup.py: QuestieDB no
      # está en CI. Versión fijada en tools/foreverdb/PIN; si no se puede descargar, el harness sigue sin ella.
      - name: Caché de forever-db
        uses: actions/cache@v4
        with:
          path: .cache/foreverdb
          key: foreverdb-${{ hashFiles('tools/foreverdb/PIN') }}

      - name: forever-db
        run: python tools/fetch_foreverdb.py || echo "::warning::No se pudo preparar forever-db; verify.py y lookup.py no tendrán datos."

      - name: Tests del harness (sin red ni API)
        run: python -m unittest discover -s harness/tests -t . -v

      - name: Elegir tarea
        id: task
        run: |
          task="${{ inputs.task }}"
          if [ -z "$task" ]; then
            if [ "${{ github.event.schedule }}" = "43 7 * * 1" ]; then task=weekly; else task=daily; fi
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          args=(--budget-usd "${{ inputs.budget_usd || '5' }}")
          [ -n "${{ inputs.guide }}" ] && args+=(--guide "${{ inputs.guide }}")
          [ -n "${{ inputs.limit }}" ] && args+=(--limit "${{ inputs.limit }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); else args+=(--open-pr); fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Comprobar el secreto
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Continuar el PR abierto del harness (si lo hay)
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "senda-harness"
          git config user.email "senda-harness@users.noreply.github.com"
          br="$(gh pr list --label harness --state open --json headRefName -q '.[0].headRefName' || true)"
          if [ -n "$br" ]; then
            git fetch origin "$br"
            git checkout -B "$br" "origin/$br"
            if ! git merge --no-edit origin/main; then
              echo "::warning::Conflicto al actualizar $br con main; se abrirá un PR nuevo."
              git merge --abort
              git checkout main
            fi
          fi

      - name: Caché de respuestas y páginas
        uses: actions/cache@v4
        with:
          path: .cache/harness
          key: harness-cache-${{ github.run_id }}
          restore-keys: harness-cache-

      - name: Ejecutar harness
        run: python -m harness ${{ steps.task.outputs.task }} ${{ steps.task.outputs.args }} --json | tee harness-output.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Harness: ${{ steps.task.outputs.task }}"
            echo '```text'
            cat harness-output.txt 2>/dev/null || echo "{}"
            echo '```'
            latest="$(ls -t harness/reports/2*.md 2>/dev/null | head -1)"
            [ -n "$latest" ] && { echo; cat "$latest"; }
          } >> "$GITHUB_STEP_SUMMARY"
