name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: La etiqueta coincide con VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con VERSION ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Validar y generar
        run: |
          python tools/validate.py
          python tools/build.py --check

      - name: Empaquetar
        run: python tools/package.py

      - name: El zip lleva los cinco addons en la raíz, con su licencia
        run: |
          python - <<'EOF'
          import os, sys, zipfile
          z = f"dist/Senda-{os.environ['VERSION']}.zip"
          names = set(zipfile.ZipFile(z).namelist())
          addons = ("Senda", "Senda_Nav", "Senda_Nav_EK", "Senda_Nav_Kalimdor", "Senda_Lookup")
          need = [f"{a}/{f}" for a in addons for f in (f"{a}.toc", "LICENSE", "THIRD_PARTY.md")]
          missing = [n for n in need if n not in names]
          extra = sorted({n.split("/")[0] for n in names} - set(addons))
          if missing or extra:
              print(f"::error::zip incompleto: faltan {missing}; carpetas de más {extra}")
              sys.exit(1)
          print(f"{z}: {len(names)} archivos en {', '.join(addons)}")
          EOF

      - name: Notas desde CHANGELOG.md
        run: python tools/package.py --changelog "$VERSION" > release-notes.md

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/Senda-$VERSION.zip" \
            --title "Senda $VERSION" --notes-file release-notes.md $prerelease
